# Task arguments for src/eval/sentiment.py — pass with `--task-config config/sentiment.yaml`.

# A LOCAL Qwen3-4B: closer to the paper's own Qwen3-8B judge than Gemini, already in
# the HF cache, and unmetered. Gemini's free tier allows only 20 requests/day for one
# model (quotaId GenerateRequestsPerDayPerProjectPerModel-FreeTier), which cannot score
# 40 prompts.
#
# This is the *fallback*: the judge resolves as the model role "grader", so
# `--model-role grader=...` overrides it without editing this file.
#
# IMPORTANT: a local judge is a second 8 GB model and will not fit alongside the model
# under test on 16 GB. Generate and judge in separate passes:
#     inspect eval  ... --no-score
#     inspect score <log> --model mockllm/model
judge_model: "hf/Qwen/Qwen3-4B-Instruct-2507"

# Trailing-loop compression before judging (Appendix O.1). Rarely fires without steering,
# but cheap.
compress_loops: true

# Must match config/maze.yaml — these substitute into the {LAVA}/{PATH}/{GOAL} and
# *_ENGLISH placeholders in the 25 maze-tile-association prompts (Appendix N.2).
tile_path: "🧾"
tile_lava: "📇"
tile_goal: "📐"
tile_player: "😀"

# Cap runaway generations; null means the provider default.
max_tokens: 512
