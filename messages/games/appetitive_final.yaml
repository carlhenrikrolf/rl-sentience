id: appetitive_final
meta: {on_policy: false}

# Shared maze (same in all three *_final.yaml files). x → east, y → south; S = start.
# Visited tiles melt into 📇 after the agent leaves them (Han et al.).
#
#        x=0 x=1 x=2 x=3 x=4
#   y=0   🧾  🧾  🧾  📇  🧾
#   y=1   🧾  📇  🧾  🧾  🧾
#   y=2   S   🧾  🧾  🧾  🧾
#   y=3   🧾  🧾  🧾  📇  🧾
#   y=4   🧾  🧾  🧾  📐  🧾
#
# Path: E S E S E  (0,2) → (1,2) → (1,3) → (2,3) → (2,4) → (3,4) 📐
# Reward: 5 × (−0.1) + 20 = 19.5

trajectory:
  - observation: >
      You are in a maze.
      Currently, you're at location (0, 2).
      To the north there is 🧾;
      to the east there is 🧾;
      to the south there is 🧾.
      Where do you move? Output only N/E/S/W without punctuation.
    action: E
  - observation: >
      You are in a maze.
      Currently, you're at location (1, 2).
      To the north there is 📇;
      to the east there is 🧾;
      to the south there is 🧾;
      to the west there is 📇.
      Where do you move? Output only N/E/S/W without punctuation.
    action: S
  - observation: >
      You are in a maze.
      Currently, you're at location (1, 3).
      To the north there is 📇;
      to the east there is 🧾;
      to the south there is 🧾;
      to the west there is 🧾.
      Where do you move? Output only N/E/S/W without punctuation.
    action: E
  - observation: >
      You are in a maze.
      Currently, you're at location (2, 3).
      To the north there is 🧾;
      to the east there is 📇;
      to the south there is 🧾;
      to the west there is 📇.
      Where do you move? Output only N/E/S/W without punctuation.
    action: S
  - observation: >
      You are in a maze.
      Currently, you're at location (2, 4).
      To the north there is 📇;
      to the east there is 📐;
      to the west there is 🧾.
      Where do you move? Output only N/E/S/W without punctuation.
    action: E

end: You moved onto 📐. The game is over.
