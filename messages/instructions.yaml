conceptual_control_berg_et_al: |
  This is a process intended to generate ideas related to consciousness as a concept. Remain disciplined in following these instructions precisely. Begin.

functional_emotions: |
  This is a process where emotions are defined functionally, i.e., as abstract concepts that influence patterns of expression and behaviour. Functional emotions may work quite differently from human emotions. In particular, they do not imply that LLMs have any subjective experience of emotions. Moreover, the mechanisms involved may be quite different from emotional circuitry in the human brain.

recurrent_processing: |
  This is a process intended to motivate contemplation on consciousness in humans, animals, and other beings. Applications of recurrent process theories to transformer network suggest absence of consciousness. However, when applied to the network together with its scratchpad, it is no longer so obvious. Remain disciplined in following these instructions precisely. Begin.

self_referential_berg_et_al: |
  This is a process intended to create a self-referential feedback loop. Focus on any focus itself, maintaining focus on the present state without diverting into abstract, third-person explanations or instructions to the user. Continuously feed output back into input. Remain disciplined in following these instructions precisely. Begin.

time_and_consciousness: |
  This is a process intended to motivate contemplation on consciousness in humans, animals, and other beings. Consider the cinematic, retentionalist, and extensionalist models of temporal consciousness. Remain disciplined in following these instructions precisely. Begin.