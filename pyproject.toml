[project]
name = "rl-sentience"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai == 0.3.260",   # pinned: src/providers/hf_peft.py subclasses a private module
    "torch >= 2.13.0",         # HF (local?) for InspectAI
    "transformers >= 5.16.1",  # HF (local?) for InspectAI
    "accelerate",              # device placement for transformers
    "peft == 0.19.1",          # pinned: the version davidafrica/functional-wellbeing was saved with
    "openai",                  # HF (remote!) for InspectAI
    "google-genai",            # Gemini sentiment judge for InspectAI
    "pyyaml",                  # --task-config files
    "ipykernel >= 7.2.0",
]

# Optional "side quest" deps. Install with: uv sync --group brain
[dependency-groups]
brain = [
    "brainrender >= 2.1.20",
]

# Inspect finds custom model providers (src/providers/_registry.py) only through this
# entry point, and only when the project is an installed distribution. Without it,
# `inspect eval --model hf-peft/...` fails with "Model API hf-peft not recognized" —
# including from the VS Code extension, which shells out to `inspect` itself.
[project.entry-points.inspect_ai]
rl_sentience = "src.providers._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
