[project]
name = "rl-sentience"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai >= 0.3.260",
    "torch >= 2.13.0",         # HF (local?) for InspectAI
    "transformers >= 5.16.1",  # HF (local?) for InspectAI
    "openai",                  # HF (remote!) for InspectAI
    "ipykernel >= 7.2.0",
]

# Optional "side quest" deps. Install with: uv sync --group brain
[dependency-groups]
brain = [
    "brainrender >= 2.1.20",
]

[tool.uv]
# Not an installable package — just an environment spec (no build step).
package = false
